[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fronts_representation_learning"
version = "0.0.dev0"
readme = "README.md"
license = { text = "BSD" }
authors = [
    { name = "J. Tallman", email = "jttallman@ucdavis.edu" }
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Oceanography",
    "Programming Language :: Python :: 3"
]

urls = { "Homepage" = "https://github.com/AI-for-Ocean-Science/" }
requires-python = ">=3.12"

dependencies = [
    "dbof-in-native-grid @ git+https://github.com/Sea-Meets-the-Stars/llc4320-native-grid-preprocessing.git@main",
    "front-finding @ git+https://github.com/Sea-Meets-the-Stars/front-finding.git@main",
    # ========================================================================
    # TODO: PIN IS A BRANCH, NOT main.  Switch to @main once the
    # speed_up_assess_overlap PR is merged.  Until then this ref can move or
    # be deleted out from under any install, and nothing here is reproducible.
    # ========================================================================
    "nemi-learn @ git+https://github.com/CompClimate/NEMI.git@speed_up_assess_overlap",
    "numpy",
    "pandas",
    "scikit-learn",
    "torch==2.8.0",
    "torchvision",
    "timm==0.3.2",
    "xmitgcm",
    "dask==2025.10.0",
    "s3fs==2025.9.0",
    "ipywidgets",
    "einops"
]

[project.optional-dependencies]

plotting = [
    "matplotlib",
    "seaborn",
    "bokeh",
    "cmocean",
]

test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
